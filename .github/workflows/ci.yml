name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM unit tests (core, parsers, platform, feature, app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        # v6 moved caching into `gradle-actions-caching`, a proprietary component that is not
        # covered by the MIT licence and whose Terms of Use you accept by upgrading. `basic` is the
        # MIT-licensed provider (built on @actions/cache) added in v6.1.0; it keys the cache on the
        # build files and clears it when they change, which is what this repo needs. Stated at every
        # call site rather than inherited, because the default is `enhanced`.
        with:
          cache-provider: basic
      - name: Unit tests
        run: >
          ./gradlew --no-daemon --console=plain
          :core:model:test :core:parser:test :core:identity:test :core:reconcile:test
          :core:analytics:test :parsers:apps:test
          :platform:crypto:testDebugUnitTest :platform:storage:testDebugUnitTest :platform:backup:testDebugUnitTest :platform:capture:testDebugUnitTest
          :feature:analytics:testDebugUnitTest :feature:search:testDebugUnitTest :feature:conversation:testDebugUnitTest :app:testDebugUnitTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/**"

  assemble:
    name: Assemble + permission gate
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        # v6 moved caching into `gradle-actions-caching`, a proprietary component that is not
        # covered by the MIT licence and whose Terms of Use you accept by upgrading. `basic` is the
        # MIT-licensed provider (built on @actions/cache) added in v6.1.0; it keys the cache on the
        # build files and clears it when they change, which is what this repo needs. Stated at every
        # call site rather than inherited, because the default is `enhanced`.
        with:
          cache-provider: basic
      - name: String catalogues complete in every locale
        run: python3 tools/check-strings.py
      - name: Assemble debug and release (unsigned)
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: No network permission in release APK
        run: tools/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

  instrumented:
    # Real SQLCipher needs an Android runtime. Runs on the API 29/35 emulators; API 26 is a
    # separate lane per plan §15 because managed devices start at API 27.
    name: Instrumented (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: jvm-tests
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        # v6 moved caching into `gradle-actions-caching`, a proprietary component that is not
        # covered by the MIT licence and whose Terms of Use you accept by upgrading. `basic` is the
        # MIT-licensed provider (built on @actions/cache) added in v6.1.0; it keys the cache on the
        # build files and clears it when they change, which is what this repo needs. Stated at every
        # call site rather than inherited, because the default is `enhanced`.
        with:
          cache-provider: basic
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          script: ./gradlew --no-daemon --console=plain :platform:storage:connectedDebugAndroidTest :platform:crypto:connectedDebugAndroidTest :platform:backup:connectedDebugAndroidTest :feature:conversation:connectedDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: instrumented-reports-${{ matrix.api }}
          path: "**/build/reports/androidTests/**"
